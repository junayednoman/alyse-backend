on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install Node jobs
        uses: actions/setup-node@v6
        with:
          node-version: 22.17.0

      - name: Install dependencies
        run: npm install --frozen-lockfile

      - name: Add the firebase service json
        run: |
          mkdir -p src/app/private
          echo '${{secrets.FIREBASE_SERVICE_JSON}}' > src/app/private/alyse-firebase.json

      - name: Run linting
        run: npm run lint

      - name: Build app
        run: npm run build

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v5

      - name: Install Node jobs
        uses: actions/setup-node@v6
        with:
          node-version: 22.17.0

      - name: Install dependencies
        run: npm install --frozen-lockfile

      - name: Add the firebase service json
        run: |
          mkdir -p src/app/private
          echo '${{secrets.FIREBASE_SERVICE_JSON}}' > src/app/private/alyse-firebase.json

      - name: Run linting
        run: npm run lint

      - name: Add .env file
        run: echo '${{secrets.ENV_VARIABLES}}' > .env

      - name: Build app
        run: npm run build

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_PORT: ${{ secrets.EC2_PORT }}
        run: |
          set -euo pipefail

          if [ -z "${SSH_PRIVATE_KEY:-}" ]; then
            echo "SSH_PRIVATE_KEY is missing"
            exit 1
          fi

          if [ -z "${EC2_HOST:-}" ]; then
            echo "EC2_HOST is missing"
            exit 1
          fi

          EC2_PORT="${EC2_PORT:-22}"

          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -T 30 -p "$EC2_PORT" -H "$EC2_HOST" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: deploy to EC2
        env:
          EC2_HOST: ${{secrets.EC2_HOST}}
          EC2_USER: ${{secrets.EC2_USER}}
          EC2_PORT: ${{ secrets.EC2_PORT }}

        run: |
          EC2_PORT="${EC2_PORT:-22}"

          # Create deployment directory
          ssh -i ~/.ssh/id_rsa -p "$EC2_PORT" $EC2_USER@$EC2_HOST "mkdir -p ~/server"

          # Copy files to EC2 instance
          rsync -avz \
            -e "ssh -i ~/.ssh/id_rsa -p $EC2_PORT" \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.github' \
            . $EC2_USER@$EC2_HOST:~/server/

          # Install dependencies and restart server on EC2
          ssh -i ~/.ssh/id_rsa -p "$EC2_PORT" $EC2_USER@$EC2_HOST << 'EOF'
          set -e
          cd ~/server

          # Load Node environment if available
          if command -v fnm >/dev/null 2>&1; then
            eval "$(fnm env)"
          elif [ -s "$HOME/.nvm/nvm.sh" ]; then
            . "$HOME/.nvm/nvm.sh"
            nvm use --lts >/dev/null || true
          fi

          npm install --frozen-lockfile

          if pm2 describe server >/dev/null 2>&1; then
            pm2 restart server --update-env
          else
            pm2 start npm --name server -- run start
          fi
          EOF
